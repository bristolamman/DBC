<!DOCTYPE html>
<html>
<head>
    <script>
        (function() {
            // 1. Get the path (e.g., /DBC/fahed.html)
            var path = window.location.pathname;
            
            // 2. The Cleanup
            // Remove /DBC/ (case insensitive), then remove .html, then remove any trailing slashes
            var cleanPath = path.replace(/^\/DBC\//i, "")
                                .replace(/\.html$/i, "")
                                .replace(/\/$/, "");

            // 3. The New Destination
            var newDomain = "https://bristolamman.digibridge.me/";
            
            // 4. Perform the jump
            window.location.replace(newDomain + cleanPath);
        })();
    </script>
</head>
<body>
    Redirecting... if nothing happens <a href="https://bristolamman.digibridge.me">click here</a>.
</body>
</html>
